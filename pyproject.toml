[project]
name = "volley-analytics"
version = "0.1.0"
description = "Phase 1 vision pipeline for volleyball match video (calibration, tracking, heatmap, rally clips)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
tracking = [
    "onnxruntime>=1.16",
    "ultralytics>=8.1",
    "lap>=0.4",
]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
